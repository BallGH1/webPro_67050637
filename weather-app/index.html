<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wether Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🌤 Wether Dashboard</h1>
    <div>
        <input type="text" id="city-input" placeholder="พิมพ์ชื่อเมือง...">
        <button onclick="search()">ค้นหา</button>
        <p id="error-message" style="color: red;"></p>
    </div> 
    <div class="weather-card">
        <p><span id ="temp">--</span> °C</p>
        <p><span id = "city-name">--</span>,<span id = "country">--</span></p>
        <p><span id = "humidity">--</span>💧%</p>
        <p><span id = "wind-speed">--</span>💨 m/s</p>
        
    </div>
    <script src = "app.js"></script>

</body>
</html>
